[project]
name = "Tatou-Server"
version = "0.0.1"
description = "PDF Watermarking platform"
requires-python = ">=3.11"
dependencies = [
	"PyMuPDF==1.28.2",
	"Flask==3.1.3",
	"gunicorn==26.2.0",
	"PyMySQL==1.2.3",
	"SQLAlchemy==2.0.54",
	"dill==0.4.1",
	"cryptography==50.0.1",
	"reedsolo==1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
	"pylint>=4.0.0",
	"pyright==1.1.414",
	"pyscan-rs==2.1.3",
	"bandit==1.9.4"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test/"]
python_files = ["test_*.py"]

[project.scripts]
pdfwm = "app.watermarking.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pyrefly]
search-path = ["."]
