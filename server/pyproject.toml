[project]
name = "Tatou-Server"
version = "0.0.1"
description = "PDF Watermarking platform"
requires-python = ">=3.11"
dependencies = [
	"PyMuPDF==1.28.2",
	"Flask==3.1.3",
	"gunicorn==26.2.0",
	"PyMySQL==1.2.3",
	"SQLAlchemy==2.0.54",
	"rmap @ git+https://github.com/nharrand/RMAP.git@v1.0.2",
	"scipy==1.18.0",
	"numpy==2.5.3",
	"pillow==12.3.0",
	"cryptography==50.0.1",
	"reedsolo==1.7.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=9.1.0",
	"pylint>=4.0.0",
	"pyright==1.1.414",
	"pyscan-rs==2.1.3",
	"bandit==1.9.4",
]

[tool.pylint."messages control"]
disable = [
	"fixme",
	"cyclic-import",
	"too-few-public-methods",
	"too-many-arguments",
	"too-many-positional-arguments",
	"too-many-return-statements",
	"too-many-locals",
	"too-many-branches",
	"too-many-statements",
]

[tool.bandit]
exclude_dirs = ["app/watermarking/unsafe_bash_bridge_append_eof.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test/"]
python_files = ["test_*.py"]
filterwarnings = [
	"ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[project.scripts]
pdfwm = "app.watermarking.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pyrefly]
search-path = ["."]
