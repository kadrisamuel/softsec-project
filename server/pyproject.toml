[project]
name = "Tatou-Server"
version = "0.0.1"
description = "PDF Watermarking platform"
requires-python = "==3.12"
dependencies = [
	"PyMuPDF==1.28.2",
	"Flask==3.1.3",
	"gunicorn==26.2.0",
	"PyMySQL==1.2.3",
	"SQLAlchemy==2.0.54",
	"rmap @ git+https://github.com/nharrand/RMAP.git@v1.0.2",
	"scipy==1.18.0",
	"numpy==2.5.3",
	"pillow==12.3.0",
	"cryptography==50.0.1",
	"reedsolo==1.7.0",
	"werkzeug==3.1.9",
	"itsdangerous==2.2.0",
	"pydantic==2.13.5",
	"email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
	"pip-tools==7.6.1",
	"pip-audit==2.10.1",
	"deptry==0.25.1",
	"pytest==9.1.1",
	"pytest-cov==7.1.0",
	"pylint==4.1.1",
	"pyright==1.1.414",
	"bandit==1.9.4",
]

[tool.pylint."messages control"]
disable = [
	"fixme",
	"cyclic-import",
	"too-few-public-methods",
	"too-many-arguments",
	"too-many-positional-arguments",
	"too-many-return-statements",
	"too-many-locals",
	"too-many-branches",
	"too-many-statements",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test/"]
python_files = ["test_*.py"]
filterwarnings = [
	"ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
	"ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.deptry.per_rule_ignores]
DEP002 = [
	"gunicorn",
	"PyMySQL",
	"email-validator",
	"pip-tools",
	"pip-audit",
	"deptry",
	"pylint",
	"pyright",
	"bandit",
	"pytest-cov",
]

[project.scripts]
pdfwm = "app.watermarking.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pyrefly]
search-path = ["."]
