version: "3.9"

services:
  server:
    build:
      context: server
      dockerfile: Dockerfile
      secrets:
        - flag_2
    ports:
      - "${APP_PORT:-5000}:5000"
    secrets:
      - private_key
      - private_key_pass
      - watermarking_key
      - group_pdf
    volumes:
      - user-files:/app/storage
    environment:
      - PYTHONUNBUFFERED=1
      # DB connection details for future use by the API
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=tatou
      - DB_USER=${MARIADB_USER}
      - DB_PASSWORD=${MARIADB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - SALT=${SALT}
      - ENABLE_MAIN_ROUTES=${ENABLE_MAIN_ROUTES:-false}
      - ENABLE_AUTH_ROUTES=${ENABLE_AUTH_ROUTES:-false}
      - ENABLE_DOCUMENT_ROUTES=${ENABLE_DOCUMENT_ROUTES:-false}
      - ENABLE_WATERMARKING_ROUTES=${ENABLE_WATERMARKING_ROUTES:-false}
      - ENABLE_RMAP_ROUTES=${ENABLE_RMAP_ROUTES:-false}
      - RMAP_SERVER_PUBLIC_KEY_PATH=${RMAP_SERVER_PUBLIC_KEY_PATH}
      - RMAP_SERVER_PRIVATE_KEY_PATH=${RMAP_SERVER_PRIVATE_KEY_PATH}
      - RMAP_SERVER_PRIVATE_KEY_PASS_FILE=${RMAP_SERVER_PRIVATE_KEY_PASS_FILE}
      - RMAP_CLIENT_KEYS_DIR=${RMAP_CLIENT_KEYS_DIR}
      - RMAP_WATERMARK_METHOD=${RMAP_WATERMARK_METHOD}
      - RMAP_LINK_PREFIX=${RMAP_LINK_PREFIX}
      - RMAP_WATERMARKING_KEY_PATH=${RMAP_WATERMARKING_KEY_PATH}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:12.3
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=tatou
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/tatou.sql:/docker-entrypoint-initdb.d/10-tatou.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root --password=$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
  user-files:

secrets:
  private_key:
    file: private.key
  private_key_pass:
    environment: RMAP_SERVER_PRIVATE_KEY_PASS
  watermarking_key:
    environment: WATERMARKING_MASTER_KEY
  group_pdf:
    file: Group_02.pdf
  flag_2:
    environment: FLAG_2
